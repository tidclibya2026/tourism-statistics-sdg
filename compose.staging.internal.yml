services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${STAGING_DB_NAME}
      MYSQL_USER: ${STAGING_DB_USER}
      MYSQL_PASSWORD: ${STAGING_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${STAGING_DB_PORT:-3307}:3306"
    volumes:
      - staging_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    networks:
      - staging

  migrate:
    build:
      context: .
      target: migration
    env_file: ${STAGING_ENV_FILE:-deploy/staging.internal.env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles: [tools]
    networks:
      - staging

  app:
    build:
      context: .
      target: runtime
      args:
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-manus}
        VITE_AUTH_CLIENT_ID: ${VITE_AUTH_CLIENT_ID:-}
        VITE_APP_ID: ${VITE_APP_ID}
        VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL}
        VITE_OIDC_AUTHORIZATION_URL: ${VITE_OIDC_AUTHORIZATION_URL:-}
        VITE_STORAGE_PUBLIC_BASE_URL: ${VITE_STORAGE_PUBLIC_BASE_URL:-/manus-storage}
    env_file: ${STAGING_ENV_FILE:-deploy/staging.internal.env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-192.168.1.2}:${APP_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 4s
      start_period: 30s
      retries: 5
    networks:
      - staging

volumes:
  staging_mysql_data:

networks:
  staging:
    driver: bridge
