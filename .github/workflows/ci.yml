name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Secret scan, TypeScript, tests, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for secrets
        run: pnpm security:secrets

      - name: TypeScript check
        run: pnpm check

      - name: Database migration readiness
        run: pnpm db:readiness

      - name: Unit and integration tests
        run: pnpm test --run

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Build application
        run: pnpm build

      - name: Write quality evidence
        run: node scripts/write-ci-evidence.mjs quality secret-scan migration-readiness typescript tests dependency-audit production-build

      - name: Upload quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-quality-${{ github.sha }}
          path: release-evidence-quality.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tourism-statistics-sdg-build-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  container:
    name: Build and scan hardened container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate internal staging Compose configuration
        env:
          STAGING_ENV_FILE: deploy/staging.internal.env.template
        run: docker compose --env-file deploy/staging.internal.env.template -f compose.staging.internal.yml config --quiet

      - name: Build runtime image
        run: |
          docker build \
            --build-arg VITE_AUTH_PROVIDER=manus \
            --build-arg VITE_APP_ID=ci-placeholder \
            --build-arg VITE_OAUTH_PORTAL_URL=https://oauth.example.invalid \
            --tag tourism-statistics-sdg:${{ github.sha }} \
            .

      - name: Scan runtime image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tourism-statistics-sdg:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Write container evidence
        run: node scripts/write-ci-evidence.mjs container container-build container-vulnerability-scan

      - name: Upload container evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-container-${{ github.sha }}
          path: release-evidence-container.json
          retention-days: 30
          if-no-files-found: error
